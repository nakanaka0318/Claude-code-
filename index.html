<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>関ヶ原 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
  /* 墨と和紙を基調にした単一テーマ（戦場の地図に重ねる HUD のため暗色で固定） */
  :root {
    color-scheme: dark;
    --ink: #17150f;
    --panel: rgba(23, 21, 15, 0.82);
    --panel-solid: #1d1a13;
    --paper: #efe7d4;
    --paper-dim: #b8ae98;
    --paper-faint: #847b68;
    --line: rgba(239, 231, 212, 0.16);
    --gold: #d6aa4f;
    --east: #6c9be0;
    --west: #e0634a;
    --turn: #b784de;
    --idle: #9b9483;
    --display: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --ui: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--ui);
    font-size: 14px;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app { position: fixed; inset: 0; overflow: hidden; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button, select { font: inherit; color: inherit; }
  button:focus-visible, select:focus-visible, input:focus-visible, .lbl:focus-visible {
    outline: 2px solid var(--gold); outline-offset: 2px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  /* ---- 上部 HUD ---- */
  .top {
    position: absolute; left: 0; right: 0; top: 0;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px 0;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
    pointer-events: none;
  }
  .top > * { pointer-events: auto; }
  .brand { padding: 12px 16px 12px; display: grid; gap: 2px; min-width: 0; }
  .brand h1 {
    margin: 0; font-family: var(--display); font-weight: 800; font-size: 26px;
    letter-spacing: 0.12em; line-height: 1.1;
  }
  .brand .era { color: var(--paper-dim); font-size: 12px; letter-spacing: 0.06em; }
  .clock { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
  .clock .koku {
    font-family: var(--display); font-weight: 800; color: var(--gold); font-size: 20px; letter-spacing: 0.08em;
  }
  .clock .hm { font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
  .clock .ampm { color: var(--paper-dim); font-size: 12px; }

  .side { display: grid; gap: 10px; justify-items: end; }
  .forces { padding: 10px 14px; width: 270px; display: grid; gap: 8px; }
  .forces .row { display: grid; grid-template-columns: 56px 1fr 64px; align-items: center; gap: 8px; font-size: 12px; }
  .forces .nm { font-family: var(--display); font-weight: 800; font-size: 14px; letter-spacing: 0.1em; }
  .forces .bar { height: 6px; background: rgba(239,231,212,0.08); border-radius: 3px; overflow: hidden; }
  .forces .bar i { display: block; height: 100%; width: 0; border-radius: 3px; transition: width .4s ease; }
  .forces .num { text-align: right; font-variant-numeric: tabular-nums; }
  .forces .e .nm { color: var(--east); } .forces .e .bar i { background: var(--east); }
  .forces .w .nm { color: var(--west); } .forces .w .bar i { background: var(--west); }
  .forces .n .nm { color: var(--idle); } .forces .n .bar i { background: var(--idle); }
  .forces .note { color: var(--paper-faint); font-size: 11px; }

  /* ---- 戦況一覧 ---- */
  #log { width: 270px; max-height: calc(100vh - 360px); display: flex; flex-direction: column; }
  #log h2 {
    margin: 0; padding: 10px 14px 8px; font-family: var(--display); font-size: 14px; letter-spacing: 0.2em;
    border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center;
  }
  #log h2 button { background: none; border: 0; color: var(--paper-dim); cursor: pointer; font-size: 18px; padding: 0 4px; display: none; }
  #events { list-style: none; margin: 0; padding: 6px 0; overflow-y: auto; }
  #events li button {
    width: 100%; text-align: left; background: none; border: 0; cursor: pointer;
    display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 5px 14px; font-size: 13px; line-height: 1.4;
    color: var(--paper-faint);
  }
  #events li button:hover { background: rgba(239,231,212,0.06); }
  #events li.past button { color: var(--paper-dim); }
  #events li.now button { color: var(--paper); background: rgba(214,170,79,0.12); }
  #events li.now .t { color: var(--gold); }
  #events .t { font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 1px; }
  #events li.key .ti { font-weight: 700; }

  /* ---- 解説カード ---- */
  .dock {
    position: absolute; left: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    width: min(440px, calc(100% - 32px)); display: grid; gap: 10px;
  }
  #caption { padding: 12px 16px 12px; }
  #caption .head { display: flex; align-items: center; gap: 10px; }
  #caption .when {
    font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink); background: var(--gold);
    padding: 1px 7px; border-radius: 3px; font-weight: 700;
  }
  #caption h3 { margin: 0; flex: 1; font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: 0.04em; text-wrap: balance; }
  #caption .nav { display: flex; gap: 4px; }
  #caption .nav button {
    width: 28px; height: 28px; border-radius: 4px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--paper-dim);
  }
  #caption .nav button:hover { color: var(--paper); border-color: var(--paper-faint); }
  #caption p { margin: 8px 0 0; line-height: 1.75; color: var(--paper-dim); font-size: 13.5px; max-height: 9.5em; overflow-y: auto; }

  #info { padding: 12px 16px 14px; position: relative; }
  #info .close {
    position: absolute; right: 8px; top: 8px; width: 28px; height: 28px; border: 0; background: none;
    color: var(--paper-dim); cursor: pointer; font-size: 18px;
  }
  #info .aff { font-size: 12px; letter-spacing: 0.1em; font-weight: 700; }
  #info h3 { margin: 2px 0 6px; font-family: var(--display); font-weight: 800; font-size: 20px; letter-spacing: 0.06em; }
  #info dl { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 2px 10px; margin: 0 0 8px; font-size: 12.5px; }
  #info dt { color: var(--paper-faint); }
  #info dd { margin: 0; font-variant-numeric: tabular-nums; }
  #info p { margin: 0; color: var(--paper-dim); line-height: 1.7; font-size: 13px; }

  /* ---- 時間軸 ---- */
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
    background: linear-gradient(to top, rgba(23,21,15,0.92), rgba(23,21,15,0.7) 70%, rgba(23,21,15,0));
    display: flex; align-items: center; gap: 12px;
  }
  #play {
    flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--gold);
    background: var(--gold); color: var(--ink); cursor: pointer; font-size: 17px; display: grid; place-items: center;
  }
  #play[aria-pressed="true"] { background: transparent; color: var(--gold); }
  .timeline { flex: 1; min-width: 0; position: relative; padding-top: 14px; }
  .timeline .hours { position: absolute; left: 0; right: 0; top: 0; height: 12px; font-size: 10px; color: var(--paper-faint); font-variant-numeric: tabular-nums; }
  .timeline .hours span { position: absolute; transform: translateX(-50%); }
  .ticks { position: absolute; left: 0; right: 0; top: 18px; height: 16px; pointer-events: none; }
  .ticks i { position: absolute; width: 2px; height: 8px; top: 4px; background: var(--paper-faint); transform: translateX(-1px); border-radius: 1px; }
  .ticks i.key { height: 14px; top: 1px; background: var(--gold); }
  #time { width: 100%; margin: 0; height: 24px; background: transparent; -webkit-appearance: none; appearance: none; cursor: pointer; position: relative; }
  #time::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--gold) var(--p, 0%), rgba(239,231,212,0.18) var(--p, 0%)); }
  #time::-moz-range-track { height: 4px; border-radius: 2px; background: rgba(239,231,212,0.18); }
  #time::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--gold); }
  #time::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--paper); margin-top: -6px; border: 2px solid var(--gold); }
  #time::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--paper); border: 2px solid var(--gold); }
  .ctrls { display: flex; gap: 8px; align-items: center; flex: none; }
  .ctrls select, .ctrls button {
    height: 32px; border-radius: 4px; border: 1px solid var(--line); background: rgba(23,21,15,0.6); padding: 0 8px; cursor: pointer; font-size: 12.5px;
  }
  .ctrls button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .ctrls select option { background: var(--panel-solid); }
  #logBtn { display: none; }

  /* ---- 名札 ---- */
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels.off .lbl { display: none; }
  .lbl {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap;
    transform: translate(-50%, -100%); font-size: 11.5px; line-height: 1.25;
    background: rgba(23,21,15,0.78); border-left: 3px solid var(--c, var(--idle)); padding: 2px 6px 2px 5px; border-radius: 2px;
    display: flex; gap: 6px; align-items: baseline; will-change: transform;
  }
  .lbl b { font-family: var(--display); font-weight: 800; letter-spacing: 0.03em; }
  .lbl span { color: var(--paper-dim); font-variant-numeric: tabular-nums; font-size: 10.5px; }
  #labels.far .lbl span { display: none; }
  .lbl em { font-style: normal; font-size: 10px; color: var(--turn); }
  .lbl.east { --c: var(--east); } .lbl.west { --c: var(--west); } .lbl.idle { --c: var(--idle); } .lbl.turn { --c: var(--turn); }
  .lbl.rout { opacity: 0.6; }
  .lbl.sel { background: rgba(214,170,79,0.9); color: var(--ink); }
  .lbl.sel span, .lbl.sel em { color: var(--ink); }
  .place {
    position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
    font-family: var(--display); font-weight: 600; font-size: 12px; letter-spacing: 0.3em; color: rgba(245,238,220,0.86);
    text-shadow: 0 1px 3px rgba(0,0,0,0.85), 0 0 8px rgba(0,0,0,0.5);
  }
  .place.road { font-size: 11px; letter-spacing: 0.15em; color: rgba(236,220,180,0.75); }

  .legend { padding: 7px 12px; display: flex; gap: 12px; font-size: 11.5px; color: var(--paper-dim); flex-wrap: wrap; justify-content: flex-end; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 1px; margin-right: 4px; vertical-align: -1px; }
  .hint { color: var(--paper-faint); font-size: 11px; text-align: right; text-shadow: 0 1px 2px rgba(0,0,0,.8); max-width: 270px; }

  #loading {
    position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink);
    font-family: var(--display); letter-spacing: 0.4em; font-size: 18px; color: var(--paper-dim); transition: opacity .6s;
  }
  #loading.done { opacity: 0; pointer-events: none; }

  @media (max-width: 760px) {
    .top { gap: 8px; }
    .brand { padding: 8px 12px; flex: none; }
    .brand h1 { font-size: 20px; }
    .brand .era { display: none; }
    .clock { margin-top: 2px; gap: 6px; white-space: nowrap; }
    .clock .koku, .clock .hm { font-size: 16px; }
    .side { min-width: 0; flex: 1; }
    .forces { width: 100%; max-width: 230px; box-sizing: border-box; padding: 8px 10px; gap: 5px; }
    .forces .row { grid-template-columns: 40px 1fr 50px; gap: 6px; font-size: 11px; }
    .forces .nm { font-size: 12px; }
    .forces .note, .hint, .legend { display: none; }
    #log {
      display: none; position: fixed; left: 16px; right: 16px; width: auto;
      top: calc(env(safe-area-inset-top, 0px) + 110px); bottom: calc(env(safe-area-inset-bottom, 0px) + 130px); max-height: none; z-index: 5;
      background: var(--panel-solid);
    }
    #log.open { display: flex; }
    #log h2 button { display: block; }
    #logBtn { display: inline-block; }
    .dock { bottom: calc(env(safe-area-inset-bottom, 0px) + 116px); }
    #caption p { max-height: 5.4em; font-size: 12.5px; }
    .bottom { flex-wrap: wrap; row-gap: 6px; }
    .timeline { order: 3; flex-basis: 100%; }
    .ctrls { margin-left: auto; gap: 5px; }
    .ctrls select, .ctrls button { padding: 0 6px; font-size: 11.5px; }
    #view { width: 84px; }
    #play { width: 40px; height: 40px; }
    .lbl { font-size: 10.5px; padding: 1px 5px 1px 4px; }
    .lbl span { display: none; }
    .dock.has-info #caption { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .forces .bar i, #loading { transition: none; }
  }
</style>

<div id="app">
  <canvas id="c" aria-label="関ヶ原の戦いの3D戦場"></canvas>
  <div id="labels"></div>

  <div class="top">
    <div class="brand panel">
      <h1>関ヶ原</h1>
      <div class="era">慶長五年九月十五日（1600年10月21日）</div>
      <div class="clock" aria-live="polite">
        <span class="koku" id="koku">辰の刻</span>
        <span class="hm" id="hm">7:00</span>
        <span class="ampm" id="ampm">午前</span>
      </div>
    </div>
    <div class="side">
      <div class="forces panel" aria-label="兵力">
        <div class="row e"><span class="nm">東軍</span><span class="bar"><i id="barE"></i></span><span class="num" id="numE">0</span></div>
        <div class="row w"><span class="nm">西軍</span><span class="bar"><i id="barW"></i></span><span class="num" id="numW">0</span></div>
        <div class="row n"><span class="nm">傍観</span><span class="bar"><i id="barN"></i></span><span class="num" id="numN">0</span></div>
        <div class="note">戦場に残る兵の概数。兵力は諸説あり。</div>
      </div>
      <div class="legend panel">
        <span><i style="background:var(--east)"></i>東軍</span>
        <span><i style="background:var(--west)"></i>西軍</span>
        <span><i style="background:var(--turn)"></i>寝返り</span>
        <span><i style="background:var(--idle)"></i>傍観</span>
      </div>
      <aside id="log" class="panel" aria-label="戦況一覧">
        <h2>戦況<button id="logClose" aria-label="閉じる">×</button></h2>
        <ol id="events"></ol>
      </aside>
      <div class="hint">ドラッグで回転／右ドラッグ・二本指で移動／ホイールで拡大。部隊の名札をクリックすると詳細を表示。</div>
    </div>
  </div>

  <div class="dock" id="dock">
    <section id="info" class="panel" hidden>
      <button class="close" id="infoClose" aria-label="閉じる">×</button>
      <div class="aff" id="infoAff">西軍</div>
      <h3 id="infoName">石田三成</h3>
      <dl>
        <dt>兵力</dt><dd id="infoTroops">6,000</dd>
        <dt>状態</dt><dd id="infoState">布陣</dd>
        <dt>布陣</dt><dd id="infoPlace">笹尾山</dd>
        <dt>当初</dt><dd id="infoInit">6,000</dd>
      </dl>
      <p id="infoDesc"></p>
    </section>
    <section id="caption" class="panel" aria-live="polite">
      <div class="head">
        <span class="when" id="capWhen">7:00</span>
        <h3 id="capTitle">夜明け・濃霧</h3>
        <div class="nav">
          <button id="prevEv" aria-label="前の出来事">‹</button>
          <button id="nextEv" aria-label="次の出来事">›</button>
        </div>
      </div>
      <p id="capText"></p>
    </section>
  </div>

  <div class="bottom">
    <button id="play" aria-pressed="false" aria-label="再生">▶</button>
    <div class="timeline">
      <div class="hours" id="hours"></div>
      <div class="ticks" id="ticks"></div>
      <input type="range" id="time" min="0" max="570" step="0.5" value="0" aria-label="時刻">
    </div>
    <div class="ctrls">
      <select id="speed" aria-label="再生速度">
        <option value="0.5">×0.5</option>
        <option value="1">×1</option>
        <option value="2" selected>×2</option>
        <option value="4">×4</option>
        <option value="8">×8</option>
      </select>
      <select id="view" aria-label="視点">
        <option value="">視点…</option>
        <option value="all">全景</option>
        <option value="sasao">笹尾山（石田本陣）</option>
        <option value="tenma">天満山（宇喜多）</option>
        <option value="matsuo">松尾山（小早川）</option>
        <option value="momo">桃配山（家康本陣）</option>
        <option value="nangu">南宮山（毛利）</option>
      </select>
      <button id="camBtn" aria-pressed="true" title="出来事に合わせて視点を自動で動かす">自動視点</button>
      <button id="lblBtn" aria-pressed="true">名札</button>
      <button id="logBtn" aria-pressed="false">戦況</button>
    </div>
  </div>

  <div id="loading">布陣中…</div>
</div>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =========================================================
   基本ユーティリティ
   座標系: 1単位 = 約10m。x は東、z は南（-z が北）。
   原点は関ヶ原宿（中山道・北国街道・伊勢街道の交点）付近。
   ========================================================= */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const TAU = Math.PI * 2;
const wrap = a => ((a + Math.PI) % TAU + TAU) % TAU - Math.PI;
const angLerp = (a, b, t) => wrap(a + wrap(b - a) * t);
function mulberry32(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('ja-JP');
const approx = n => fmt(Math.round(n / 10) * 10);
const isCoarse = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 地形 ---------- */
function hash(i, j) { let h = (Math.imul(i, 374761393) + Math.imul(j, 668265263)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, z) {
  const i = Math.floor(x), j = Math.floor(z), fx = x - i, fz = z - j;
  const u = fx * fx * (3 - 2 * fx), v = fz * fz * (3 - 2 * fz);
  const a = hash(i, j), b = hash(i + 1, j), c = hash(i, j + 1), d = hash(i + 1, j + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, z) { let s = 0, a = 0.5, f = 1; for (let k = 0; k < 4; k++) { s += a * vnoise(x * f, z * f); f *= 2.03; a *= 0.5; } return s; }

// 山：笹尾山・天満山・松尾山・南宮山・桃配山・伊吹山 ほか
const BUMPS = [
  { x: -150, z: -125, h: 8, sx: 36, sz: 36 },   // 笹尾山
  { x: -195, z: 25, h: 6, sx: 40, sz: 62 },     // 天満山
  { x: -130, z: 235, h: 17, sx: 55, sz: 55 },   // 松尾山
  { x: -150, z: 330, h: 14, sx: 75, sz: 60 },   // 松尾山の背後の尾根
  { x: 390, z: 230, h: 30, sx: 110, sz: 80 },   // 南宮山
  { x: 330, z: 30, h: 3, sx: 24, sz: 22 },      // 桃配山
  { x: -100, z: -1000, h: 115, sx: 260, sz: 260 }, // 伊吹山
  { x: -330, z: -260, h: 16, sx: 120, sz: 90 }, // 北西の山並み
];
function rawH(x, z) {
  let h = 0;
  for (const b of BUMPS) { const dx = (x - b.x) / b.sx, dz = (z - b.z) / b.sz; h += b.h * Math.exp(-0.5 * (dx * dx + dz * dz)); }
  h += 20 * ss(-275, -520, x);                                                       // 西の山地（今須方面）
  h += 24 * ss(-250, -560, z) * (1 - 0.65 * ss(250, 620, x)) * (1 - 0.55 * Math.exp(-(((x + 80) / 60) ** 2))); // 北（伊吹山地）
  h += 26 * ss(310, 580, z) * (1 - 0.75 * Math.exp(-(((x - 190) / 80) ** 2)));    // 南（鈴鹿・養老山地）
  const m = Math.min(1, h / 4);
  h += (fbm(x * 0.018, z * 0.018) - 0.45) * 6 * m + (fbm(x * 0.006 + 10, z * 0.006 - 4) - 0.45) * 1.1;
  return h;
}
const H = (x, z) => rawH(x, z) * 1.4;

      const fi = v.f0 + f, o = fi * 16;
      let x, y, z, sc = 1.7, show;
      if (f < v.F) { const g = v.s0 + v.bearers[f]; show = S_ALIVE[g]; x = S_POS[g * 3]; y = S_POS[g * 3 + 1]; z = S_POS[g * 3 + 2]; }
      else { show = vis; const back = v.depth / 2 + 5; x = v.vx - fx * back; z = v.vz - fz * back; y = H(x, z); sc = 3.2; }
      if (!show) { for (let q = 0; q < 16; q++) { FM[o + q] = 0; PM[o + q] = 0; } continue; }
      FM[o] = fc * sc; FM[o + 1] = 0; FM[o + 2] = -fs * sc; FM[o + 3] = 0; FM[o + 4] = 0; FM[o + 5] = sc; FM[o + 6] = 0; FM[o + 7] = 0;
      FM[o + 8] = fs * sc; FM[o + 9] = 0; FM[o + 10] = fc * sc; FM[o + 11] = 0; FM[o + 12] = x; FM[o + 13] = y; FM[o + 14] = z; FM[o + 15] = 1;
      for (let q = 0; q < 16; q++) PM[o + q] = FM[o + q];
    }
  }
  soldiers.instanceMatrix.needsUpdate = true; poles.instanceMatrix.needsUpdate = true; flags.instanceMatrix.needsUpdate = true;
  if (colorsDirty) soldiers.instanceColor.needsUpdate = true;
}

const G = 1 / 255;
function emitEffects(dt) {
  if (!playing) return;
  const p = sim.pairs, S = sim.units;
  const noon = viewT < 330 ? 1 : 0.6;
  for (let k = 0; k < p.length; k += 2) {
    const a = S[p[k]], b = S[p[k + 1]];
    const heat = clamp((pow(a, p[k]) + pow(b, p[k + 1])) / 9000, 0.25, 1.4) * noon;
    const nSmoke = dt * 7 * heat, nFlash = dt * 14 * heat;
    for (let q = Math.floor(nSmoke + Math.random()); q > 0; q--) {
      const t = Math.random(), mx = lerp(a.x, b.x, t), mz = lerp(a.z, b.z, t);
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz) || 1, sp = (Math.random() - 0.5) * 34;
      const x = mx - dz / d * sp, z = mz + dx / d * sp, g = 0.82 + Math.random() * 0.12;
      smoke.spawn(x, H(x, z) + 1.5, z, 0.8 + Math.random(), 0.9 + Math.random() * 1.2, (Math.random() - 0.5) * 0.8, 5 + Math.random() * 4, 5, 18 + Math.random() * 10, 0.34, g, g, g * 0.98);
    }
    for (let q = Math.floor(nFlash + Math.random()); q > 0; q--) {
      const src = Math.random() < 0.5 ? a : b, dst = src === a ? b : a;
      const dx = dst.x - src.x, dz = dst.z - src.z, d = Math.hypot(dx, dz) || 1, sp = (Math.random() - 0.5) * 30;
      const x = src.x + dx / d * 9 - dz / d * sp, z = src.z + dz / d * 9 + dx / d * sp;
      flash.spawn(x, H(x, z) + 1.6, z, 0, 0, 0, 0.12 + Math.random() * 0.1, 2.5, 4, 1, 1, 0.72, 0.3);
    }
  }
  // 狼煙
  if (viewT >= 180 && viewT < 205) {
    const x = -152, z = -135;
    for (let q = Math.floor(dt * 14 + Math.random()); q > 0; q--) smoke.spawn(x + Math.random() * 2, H(x, z) + 3, z, 0.6 + Math.random() * 0.4, 7 + Math.random() * 3, (Math.random() - 0.5) * 0.6, 9 + Math.random() * 3, 4, 20, 0.6, 0.36, 0.34, 0.32);
  }
  // 石田隊の大筒
  if (viewT >= 105 && viewT < 150 && Math.random() < dt * 0.5) {
    const x = -128, z = -120;
    flash.spawn(x, H(x, z) + 2, z, 0, 0, 0, 0.3, 10, 16, 1, 1, 0.8, 0.4);
    for (let q = 0; q < 14; q++) smoke.spawn(x + (Math.random() - 0.5) * 6, H(x, z) + 2, z + (Math.random() - 0.5) * 6, 3 + Math.random() * 4, 1 + Math.random() * 2, (Math.random() - 0.5) * 4, 6 + Math.random() * 3, 7, 26, 0.5, 0.92, 0.92, 0.9);
  }
  // 問鉄砲
  if (viewT >= 292 && viewT < 300) {
    for (let q = Math.floor(dt * 12 + Math.random()); q > 0; q--) {
      const x = -95 + (Math.random() - 0.5) * 24, z = 175 + (Math.random() - 0.5) * 14;
      flash.spawn(x, H(x, z) + 1.6, z, 0, 0, 0, 0.14, 3, 4, 1, 1, 0.75, 0.3);
      if (Math.random() < 0.5) smoke.spawn(x, H(x, z) + 1.6, z, 0.6, 1.2, -0.8, 6, 5, 16, 0.35, 0.9, 0.9, 0.88);
    }
  }
}

function hourText(t) {
  const m = Math.round(7 * 60 + t), hh = Math.floor(m / 60), mm = m % 60;
  const h12 = hh > 12 ? hh - 12 : hh;
  return { hm: `${h12}:${String(mm).padStart(2, '0')}`, ampm: hh < 12 ? '午前' : '午後', hh };
}
function kokuOf(hh) { return hh < 9 ? '辰の刻' : hh < 11 ? '巳の刻' : hh < 13 ? '午の刻' : hh < 15 ? '未の刻' : '申の刻'; }

function updateEnv() {
  const t = viewT, hour = 7 + t / 60;
  // 霧は午前8時頃から晴れ始める
  const fogD = lerp(0.0017, 0.0008, ss(50, 125, t));
  scene.fog.density = fogD;
  const fogC = scene.fog.color;
  fogC.copy(FOG_MORNING).lerp(FOG_DAY, ss(50, 150, t)).lerp(FOG_EVENING, ss(420, 570, t));
  fogUniforms.uFogDensity.value = fogD;
  fogUniforms.uFogColor.value.copy(fogC).convertLinearToSRGB();
  // 10月下旬の太陽（北緯35度）
  const azN = THREE.MathUtils.degToRad(105 + (hour - 6) * 13.5), el = THREE.MathUtils.degToRad(Math.max(6, 42 * Math.sin(Math.PI * (hour - 6) / 11.2)));
  sun.position.set(SUN_CENTER.x + Math.sin(azN) * Math.cos(el) * 1200, Math.sin(el) * 1200, SUN_CENTER.z - Math.cos(azN) * Math.cos(el) * 1200);
  const low = 1 - ss(8, 30, THREE.MathUtils.radToDeg(el));
  sun.color.setRGB(1, 0.95 - low * 0.15, 0.86 - low * 0.3);
  sun.intensity = lerp(1.2, 2.1, ss(40, 140, t)) * (1 - 0.25 * ss(480, 570, t));
  hemi.intensity = lerp(1.45, 1.2, ss(40, 140, t));
}

/* ---------- HUD ---------- */
const evList = $('#events'), ticks = $('#ticks'), hours = $('#hours');
EVENTS.forEach((e, i) => {
  const li = document.createElement('li'); if (e.key) li.classList.add('key');
  const b = document.createElement('button');
  b.innerHTML = `<span class="t">${hourText(e.t).hm}</span><span class="ti">${e.title}</span>`;
  b.addEventListener('click', () => { seek(e.t + 0.01); showEvent(i, true); if (isCoarse) toggleLog(false); });
  li.appendChild(b); evList.appendChild(li); e.li = li;
  const tk = document.createElement('i'); if (e.key) tk.className = 'key';
  tk.style.left = `calc(${(e.t / T_END) * 100}% + ${8 - 16 * e.t / T_END}px)`; tk.title = e.title; ticks.appendChild(tk);
});
for (let h = 7; h <= 16; h++) {
  const t = (h - 7) * 60, sp = document.createElement('span');
  sp.style.left = `calc(${(t / T_END) * 100}% + ${8 - 16 * t / T_END}px)`; sp.textContent = h; hours.appendChild(sp);
}
let curEv = -1;
function showEvent(i, fly) {
  curEv = i;
  const e = EVENTS[i];
  $('#capWhen').textContent = hourText(e.t).hm; $('#capTitle').textContent = e.title; $('#capText').textContent = e.text;
  EVENTS.forEach((ev, k) => { ev.li.classList.toggle('past', k < i); ev.li.classList.toggle('now', k === i); });
  e.li.scrollIntoView({ block: 'nearest' });
  if (fly && autoCam && e.view) flyTo(V[e.view]);
}
const slider = $('#time');
function updateHud() {
  const { hm, ampm, hh } = hourText(viewT);
  $('#hm').textContent = hm; $('#ampm').textContent = ampm; $('#koku').textContent = kokuOf(hh);
  slider.value = viewT; slider.style.setProperty('--p', `${(viewT / T_END) * 100}%`);
  let e = 0, w = 0, n = 0;
  sim.units.forEach((s, i) => {
    if (!alive(s) || s.mode === 'rout') return;
    const p = pow(s, i);
    if (s.passive) n += p; else if (s.side === 'east') e += p; else w += p;
  });
  const mx = 100000;
  $('#numE').textContent = approx(e); $('#numW').textContent = approx(w); $('#numN').textContent = approx(n);
  $('#barE').style.width = `${(e / mx) * 100}%`; $('#barW').style.width = `${(w / mx) * 100}%`; $('#barN').style.width = `${(n / mx) * 100}%`;
  if (selected >= 0) fillInfo();
}
function affOf(s) {
  if (s.turned) return ['寝返り → 東軍', 'var(--turn)'];
  if (s.side === 'east') return ['東軍', 'var(--east)'];
  if (s.passive) return ['西軍（不戦）', 'var(--idle)'];
  return ['西軍', 'var(--west)'];
}
function fillInfo() {
  const u = UNITS[selected], s = sim.units[selected], [aff, c] = affOf(s);
  $('#infoAff').textContent = aff; $('#infoAff').style.color = c;
  $('#infoName').textContent = u.name;
  $('#infoTroops').textContent = alive(s) ? '約' + approx(u.troops * s.strength) : '─';
  $('#infoState').textContent = stateOf(s);
  $('#infoPlace').textContent = u.place || '─';
  $('#infoInit').textContent = fmt(u.troops);
  $('#infoDesc').textContent = u.desc || '';
}
function select(k, fly) {
  selected = k;
  $('#info').hidden = k < 0; $('#dock').classList.toggle('has-info', k >= 0);
  LBL.forEach((l, i) => l.el.classList.toggle('sel', i === k));
  if (k < 0) { ring.visible = false; return; }
  fillInfo();
  if (fly) { const s = sim.units[k]; flyTo({ x: s.x, z: s.z, d: 150 + UV[k].depth * 2, az: THREE.MathUtils.radToDeg(camAzimuth()), el: 32 }); }
}
function camAzimuth() { return Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z); }

function updateLabels() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const camDist = camera.position.distanceTo(controls.target);
  const minTroops = camDist > 1100 ? 6000 : camDist > 620 ? 2800 : 0;
  labelsEl.classList.toggle('far', camDist > 620);
  UNITS.forEach((u, k) => {
    const s = sim.units[k], v = UV[k], L = LBL[k];
    if (!alive(s)) { if (L.el.style.display !== 'none') L.el.style.display = 'none'; return; }
    const small = !u.key && k !== selected && u.troops < minTroops;
    tmpV.set(v.vx, H(v.vx, v.vz) + 12 + v.depth * 0.15, v.vz).project(camera);
    if (tmpV.z > 1 || small || Math.abs(tmpV.x) > 1.2 || Math.abs(tmpV.y) > 1.2) { if (L.el.style.display !== 'none') L.el.style.display = 'none'; return; }
    if (L.el.style.display === 'none') L.el.style.display = '';
    const cls = s.turned ? 'turn' : s.passive ? 'idle' : s.side;
    const c2 = cls + (s.mode === 'rout' || s.mode === 'breakout' ? ' rout' : '') + (k === selected ? ' sel' : '');
    if (L.cls !== c2) { L.el.className = 'lbl ' + c2; L.cls = c2; }
    const txt = approx(u.troops * s.strength);
    if (L.txt !== txt) { L.span.textContent = txt; L.txt = txt; }
    const tag = s.turned ? '寝返' : s.mode === 'rout' ? '敗走' : s.mode === 'breakout' ? '突破' : '';
    if (L.tag !== tag) { L.em.textContent = tag; L.tag = tag; }
    L.el.style.transform = `translate(${(tmpV.x * 0.5 + 0.5) * w}px, ${(-tmpV.y * 0.5 + 0.5) * h}px) translate(-50%, -100%)`;
  });
  for (const p of PLACES) {
    tmpV.copy(p.v).project(camera);
    const show = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    p.el.style.display = show ? '' : 'none';
    if (show) p.el.style.transform = `translate(${(tmpV.x * 0.5 + 0.5) * w}px, ${(-tmpV.y * 0.5 + 0.5) * h}px) translate(-50%, -50%)`;
  }
  if (selected >= 0 && alive(sim.units[selected])) {
    const v = UV[selected]; ring.visible = true;
    const r = Math.max(v.cols, v.rows) * v.sp * 0.75 + 4;
    ring.scale.setScalar(r); ring.position.set(v.vx, H(v.vx, v.vz) + 0.6, v.vz);
  } else ring.visible = false;
}

/* ---------- カメラ移動 ---------- */
let flight = null;
function viewPos(v) {
  const az = THREE.MathUtils.degToRad(v.az), el = THREE.MathUtils.degToRad(v.el);
  const tgt = new THREE.Vector3(v.x, Math.max(0, H(v.x, v.z)) * 0.6, v.z);
  const pos = tgt.clone().add(new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el)).multiplyScalar(v.d));
  return { tgt, pos };
}
function flyTo(v, instant) {
  const { tgt, pos } = viewPos(v);
  if (instant || reduceMotion) { controls.target.copy(tgt); camera.position.copy(pos); flight = null; return; }
  flight = { t: 0, dur: 2.4, t0: controls.target.clone(), p0: camera.position.clone(), t1: tgt, p1: pos };
}
function updateFlight(dt) {
  if (!flight) return;
  flight.t += dt / flight.dur;
  const k = flight.t >= 1 ? 1 : 1 - Math.pow(1 - flight.t, 3);
  controls.target.lerpVectors(flight.t0, flight.t1, k);
  // 高い位置を経由して移動
  camera.position.lerpVectors(flight.p0, flight.p1, k);
  camera.position.y += Math.sin(Math.PI * k) * flight.p0.distanceTo(flight.p1) * 0.15;
  if (flight.t >= 1) flight = null;
}
canvas.addEventListener('pointerdown', () => { flight = null; });
canvas.addEventListener('wheel', () => { flight = null; }, { passive: true });

/* ---------- 操作 ---------- */
function setPlaying(p) {
  playing = p;
  const b = $('#play'); b.setAttribute('aria-pressed', String(p)); b.textContent = p ? '❚❚' : '▶'; b.setAttribute('aria-label', p ? '一時停止' : '再生');
}
function seek(t) {
  t = clamp(t, 0, T_END);
  if (t < sim.t - 1e-9) { resetSim(); clearCorpses(); S_ALIVE.fill(0); }
  sim.fired.length = 0;
  advanceTo(t); viewT = t; snap = true;
  smoke.clear(); flash.clear();
  const last = sim.ev - 1; if (last >= 0 && last !== curEv) showEvent(last, false);
  updateHud();
}
$('#play').addEventListener('click', () => { if (viewT >= T_END - 0.01) seek(0); setPlaying(!playing); });
slider.addEventListener('input', () => seek(parseFloat(slider.value)));
$('#speed').addEventListener('change', e => { speed = parseFloat(e.target.value); });
$('#view').addEventListener('change', e => { const k = e.target.value; if (!k) return; flyTo(V[k] || V.all); e.target.value = ''; });
$('#camBtn').addEventListener('click', e => { autoCam = !autoCam; e.currentTarget.setAttribute('aria-pressed', String(autoCam)); });
$('#lblBtn').addEventListener('click', e => { const on = labelsEl.classList.toggle('off'); e.currentTarget.setAttribute('aria-pressed', String(!on)); });
function toggleLog(open) { $('#log').classList.toggle('open', open); $('#logBtn').setAttribute('aria-pressed', String(open)); }
$('#logBtn').addEventListener('click', () => toggleLog(!$('#log').classList.contains('open')));
$('#logClose').addEventListener('click', () => toggleLog(false));
$('#infoClose').addEventListener('click', () => select(-1));
$('#prevEv').addEventListener('click', () => { const i = Math.max(0, curEv - (viewT - EVENTS[curEv].t > 4 ? 0 : 1)); seek(EVENTS[i].t + 0.01); showEvent(i, true); });
$('#nextEv').addEventListener('click', () => { const i = Math.min(EVENTS.length - 1, curEv + 1); seek(EVENTS[i].t + 0.01); showEvent(i, true); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input, select, .lbl')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#play').click(); }
  if (e.key === 'ArrowRight') $('#nextEv').click();
  if (e.key === 'ArrowLeft') $('#prevEv').click();
});

// 兵をクリックして部隊を選ぶ
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let downAt = null;
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;
  const r = canvas.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(soldiers, false)[0];
  if (hit && hit.instanceId != null) select(S_UNIT[hit.instanceId], false);
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  const scale = renderer.getPixelRatio() * h / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  smoke.mat.uniforms.uScale.value = scale; flash.mat.uniforms.uScale.value = scale;
}
addEventListener('resize', resize);

/* ---------- ループ ---------- */
resetSim();
fireDue();
showEvent(0, false);
flyTo(V.all, true);
resize();
updateEnv();
updateHud();
let last = performance.now(), clock = 0, hudT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now; clock += dt;
  if (playing) {
    viewT = Math.min(T_END, viewT + dt * speed);
    sim.fired.length = 0;
    advanceTo(viewT);
    if (sim.fired.length) showEvent(sim.fired[sim.fired.length - 1], true);
    if (viewT >= T_END) setPlaying(false);
  }
  updateFlight(dt);
  controls.update();
  const gy = H(camera.position.x, camera.position.z) + 6;
  if (camera.position.y < gy) camera.position.y = gy;
  updateEnv();
  updateSoldiers(dt, clock);
  snap = false;
  emitEffects(dt);
  smoke.update(dt); flash.update(dt);
  flagMat.uniforms.uTime.value = clock;
  updateLabels();
  hudT += dt; if (hudT > 0.25) { hudT = 0; updateHud(); }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); $('#loading').classList.add('done'); });
if (!reduceMotion) setTimeout(() => setPlaying(true), 1500);
</script>
