<title>ビヨンド・デュエル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen battle table. Opponent above, player below, a brass seam between the two fields; log rail on wide screens. Deliberately single dark theme (a night table). */
:root{
  --bg:#13111b; --felt:#1b1828; --panel:#231f33; --panel2:#2b2640; --line:#3d3656; --fg:#f0ecf8; --muted:#a49cbb;
  --brass:#d8b46a; --pp:#5bb9ee; --hp:#e2615c; --atk:#efa743; --heal:#62d39f; --sevo:#b68eff; --chip:#38314f;
  --elf:#74c46b; --royal:#e3c34e; --dragon:#ec8642; --nemesis:#5ccad9; --neutral:#b8b1c9;
  --f-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --f-num:'Barlow Condensed','Arial Narrow',sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);margin:0;overflow:hidden;font-size:14px}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{height:100%;overflow:hidden}

/* ---------- title ---------- */
.screen-title{height:100%;overflow-y:auto;padding-inline:16px;padding-block:28px 48px;
  background:radial-gradient(1200px 500px at 80% -10%, #2a2142 0%, transparent 60%), var(--bg)}
.title-wrap{max-width:1000px;margin:0 auto;display:grid;gap:28px}
.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--brass);margin:0 0 8px;font-weight:700}
.logo{font-family:var(--f-display);font-weight:800;font-size:clamp(38px,8vw,72px);line-height:1;margin:0;letter-spacing:.02em;text-wrap:balance}
.logo span{color:var(--brass)}
.lede{max-width:62ch;color:var(--muted);line-height:1.8;margin:12px 0 0}
h2.sec{font-family:var(--f-display);font-size:20px;margin:0 0 12px;display:flex;align-items:baseline;gap:10px}
h2.sec small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.deck-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.deck{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:8px;position:relative;overflow:hidden;min-width:0}
.deck::before{content:attr(data-glyph);position:absolute;right:-6px;top:-18px;font-family:var(--f-display);font-size:96px;font-weight:800;color:var(--clsc);opacity:.12;line-height:1}
.deck[aria-pressed="true"]{border-color:var(--clsc);box-shadow:0 0 0 1px var(--clsc),0 10px 30px -12px var(--clsc)}
.deck:focus-visible{outline:2px solid var(--brass)}
.deck .dn{font-family:var(--f-display);font-weight:800;font-size:20px}
.deck .dc{font-size:11px;color:var(--clsc);font-weight:700;letter-spacing:.08em}
.deck .dd{color:var(--muted);font-size:13px;line-height:1.65}
.deck .keys{display:flex;flex-wrap:wrap;gap:4px}
.deck .keys i{font-style:normal;font-size:11px;background:var(--chip);padding:2px 6px;border-radius:4px}
.tier{position:absolute;top:14px;right:14px;font-family:var(--f-num);font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--brass);border:1px solid var(--brass);padding:0 6px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;cursor:pointer;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
.chip:focus-visible{outline:2px solid var(--brass)}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{cursor:pointer;border:1px solid var(--brass);background:var(--brass);color:#22190a;font-weight:700;padding:8px 14px;border-radius:8px;font-size:13px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.big{font-size:16px;padding:12px 26px}
.btn.evo{background:transparent;border-color:var(--brass);color:var(--brass)}
.btn.sevo{background:transparent;border-color:var(--sevo);color:var(--sevo)}
.btn.xpp{background:transparent;border-color:var(--pp);color:var(--pp)}
.decklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:2px 18px;font-size:13px}
.decklist div{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-bottom:1px solid var(--line);min-width:0}
.decklist .c{font-family:var(--f-num);font-weight:700;color:var(--pp);width:18px;text-align:right;flex:none}
.decklist .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.decklist .x{color:var(--muted);font-family:var(--f-num);flex:none}
.rulegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rulegrid div{background:var(--panel);padding:12px 14px}
.rulegrid b{display:block;font-family:var(--f-num);font-size:26px;color:var(--brass);line-height:1.1}
.rulegrid span{font-size:12px;color:var(--muted)}
.note{font-size:12px;color:var(--muted);line-height:1.7;max-width:70ch;margin:0}

/* ---------- game ---------- */
.game{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr)}
.table{height:100%;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:6px;padding-inline:16px;padding-block:8px;
  background:radial-gradient(900px 420px at 50% 50%, #241e36 0%, transparent 70%),var(--felt)}
.lbar{display:flex;align-items:center;gap:10px;min-width:0}
.leader{position:relative;flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--clsc);cursor:pointer;
  background:radial-gradient(circle at 35% 30%, color-mix(in oklab,var(--clsc) 45%, var(--panel2)), var(--panel) 70%);display:grid;place-items:center;padding:0}
.leader .glyph{position:absolute;font-family:var(--f-display);font-weight:800;font-size:30px;opacity:.12}
.leader .hpv{position:relative;font-family:var(--f-num);font-weight:700;font-size:28px;line-height:1}
.leader.low .hpv{color:var(--hp)}
.lmeta{min-width:0;display:grid;gap:3px}
.lname{font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lname .cls{color:var(--clsc);font-size:11px}
.tag{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);font-weight:500}
.res{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:12px;color:var(--muted)}
.res b{color:var(--pp);font-family:var(--f-num);font-size:17px}
.orbs{display:inline-flex;gap:2px;vertical-align:middle}
.orb{width:8px;height:8px;border-radius:50%;border:1px solid var(--pp);opacity:.9}
.orb.on{background:var(--pp)}
.orb.x{border-color:#fff;background:#fff}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pip{width:9px;height:9px;transform:rotate(45deg);border:1px solid currentColor}
.pip.on{background:currentColor}
.ep{color:var(--brass)} .sep{color:var(--sevo)}
.locked{opacity:.45}
.crests{display:flex;flex-wrap:wrap;gap:4px}
.crest{font-size:10px;border:1px solid var(--brass);color:var(--brass);border-radius:4px;padding:1px 5px;cursor:help}
.ohand{display:flex;gap:2px;margin-left:auto;flex:none}
.ohand i{width:10px;height:15px;border-radius:2px;background:linear-gradient(135deg,var(--panel2),var(--line));border:1px solid var(--line)}

.field{min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);gap:6px}
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:center;max-width:680px;width:100%;margin:0 auto;min-height:0}
.slot{height:min(100%,148px);min-height:72px;border:1px dashed var(--line);border-radius:8px;opacity:.45}
.unit{position:relative;height:min(100%,148px);min-height:72px;min-width:0;border-radius:8px;cursor:pointer;text-align:left;
  background:linear-gradient(180deg,color-mix(in oklab,var(--clsc) 30%, var(--panel2)) 0%, var(--panel) 62%);
  border:1.5px solid color-mix(in oklab,var(--clsc) 55%, var(--line));display:flex;flex-direction:column;padding:6px 5px 5px;gap:3px;transition:transform .15s}
.unit .nm{font-family:var(--f-display);font-weight:700;font-size:11px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.kws{display:flex;flex-wrap:wrap;gap:2px;margin-top:auto}
.kw{font-style:normal;font-size:9px;line-height:1.4;padding:0 3px;border-radius:3px;background:var(--chip);color:var(--fg)}
.kw.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.stats{display:flex;justify-content:space-between;gap:2px}
.atk,.hp{font-family:var(--f-num);font-weight:700;font-size:17px;min-width:22px;height:22px;padding:0 3px;display:grid;place-items:center;border-radius:5px;line-height:1;font-variant-numeric:tabular-nums}
.atk{background:var(--atk);color:#231503}
.hp{background:var(--hp);color:#200707}
.hp.hurt{background:#f2b3ae}
.buffed{box-shadow:inset 0 0 0 2px var(--heal)}
.cdv{margin-top:auto;align-self:center;width:30px;height:30px;border-radius:50%;border:2px solid var(--brass);display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:18px;color:var(--brass)}
.unit.amulet{border-style:dashed}
.unit.evo{box-shadow:0 0 0 2px var(--brass)}
.unit.sevo{box-shadow:0 0 0 2px var(--sevo),0 0 16px -2px var(--sevo)}
.unit.ready{outline:2px solid var(--heal);outline-offset:2px}
.unit.sel{transform:translateY(-5px);outline:2px solid var(--fg);outline-offset:2px}
.unit.tgt,.leader.tgt{outline:2px dashed var(--hp);outline-offset:3px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{outline-color:transparent}}

.mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;border-block:1px solid color-mix(in oklab,var(--brass) 45%, transparent);padding-block:5px}
.turninfo{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.turninfo b{color:var(--fg);font-family:var(--f-display);font-size:14px}
.turninfo .mine{color:var(--brass)}
.midbtns{display:flex;gap:6px;flex-wrap:wrap}
.btn.end{min-width:110px}
.btn.sm{padding:5px 9px;font-size:12px}
.showlog{display:none}

.abar{min-height:64px;max-height:128px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.abar .hint{color:var(--muted);font-size:12px;line-height:1.7;margin:0}
.ab-card{min-width:0;flex:1}
.ab-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ab-head b{font-family:var(--f-display);font-size:14px}
.ab-head .meta{font-size:11px;color:var(--muted)}
.ab-text{font-size:12px;line-height:1.65;margin-top:4px;color:#dcd6ea}
.ab-text em{font-style:normal;color:var(--brass);font-weight:700}
.ab-btns{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:none}
.why{font-size:11px;color:var(--hp)}
.costgem{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pp);color:#04202f;font-family:var(--f-num);font-weight:700;font-size:15px;flex:none}

.mybar{display:grid;gap:4px}
.hand{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:9px 4px 4px 8px;min-height:0}
.hcard{flex:none;position:relative;width:76px;height:104px;border-radius:8px;cursor:pointer;padding:5px;text-align:left;display:flex;flex-direction:column;gap:2px;
  background:linear-gradient(180deg,color-mix(in oklab,var(--clsc) 26%, var(--panel2)), var(--panel) 70%);border:1.5px solid var(--line);transition:transform .15s}
.hcard .cost{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;background:var(--pp);color:#04202f;font-family:var(--f-num);font-weight:700;font-size:15px;display:grid;place-items:center;border:2px solid var(--felt)}
.hcard .cost.enh{background:var(--brass);color:#22190a}
.hcard .nm{margin-top:10px;font-family:var(--f-display);font-weight:700;font-size:10.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.hcard .ty{font-size:9px;color:var(--muted);margin-top:auto}
.hcard.can{border-color:var(--heal)}
.hcard.sel{transform:translateY(-6px);border-color:var(--fg)}
.rar{position:absolute;top:5px;right:5px;width:7px;height:7px;transform:rotate(45deg)}
.r-B{background:#a77c55}.r-S{background:#c9ced8}.r-G{background:#e8c25a}.r-L{background:linear-gradient(135deg,#ff9ad0,#9ad7ff,#ffe48a)}
.hand .empty{color:var(--muted);font-size:12px;align-self:center}

.sidebar{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding-block:12px;padding-inline:14px;gap:10px}
.sidebar h3{font-family:var(--f-display);font-size:15px;margin:0;display:flex;justify-content:space-between;align-items:center}
.log{flex:1;min-height:0;overflow-y:auto;font-size:12px;line-height:1.6;display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.log li{padding:3px 0;border-bottom:1px solid #2f2945;color:#d4cee2}
.log li.t{color:var(--brass);font-weight:700;border-bottom-color:var(--line);padding-top:8px}
.legend{font-size:11px;color:var(--muted);line-height:1.7;border-top:1px solid var(--line);padding-top:8px}
.legend i{font-style:normal;color:var(--fg)}

.fx{position:absolute;left:50%;top:38%;transform:translate(-50%,0);font-family:var(--f-num);font-weight:700;font-size:24px;pointer-events:none;animation:rise 1s ease-out forwards;text-shadow:0 2px 4px #000;z-index:5;white-space:nowrap}
.fx-dmg{color:#ff8a83}.fx-heal{color:var(--heal)}.fx-buff{color:var(--heal);font-size:18px}.fx-imm{color:var(--sevo);font-size:15px}.fx-cd{color:var(--brass)}
@keyframes rise{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-34px)}}

.overlay{position:fixed;inset:0;background:rgba(9,7,15,.78);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:680px;width:100%;max-height:calc(100% - 32px);overflow:auto;display:grid;gap:14px}
.modal h2{font-family:var(--f-display);margin:0;font-size:24px}
.modal p{margin:0;color:var(--muted);line-height:1.7}
.mull{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.mcard{all:unset;box-sizing:border-box;cursor:pointer;width:120px;min-height:168px;border-radius:10px;padding:10px;position:relative;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(180deg,color-mix(in oklab,var(--clsc) 30%, var(--panel2)), var(--panel) 70%);border:1.5px solid var(--line)}
.mcard:focus-visible{outline:2px solid var(--brass)}
.mcard .nm{font-family:var(--f-display);font-weight:700;font-size:13px;line-height:1.3}
.mcard .tx{font-size:10.5px;color:var(--muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mcard[aria-pressed="true"]{border-color:var(--hp)}
.mcard[aria-pressed="true"]::after{content:'交換';position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,10,14,.62);border-radius:10px;color:var(--hp);font-weight:700;font-size:18px;letter-spacing:.2em}
.mcard .stats{margin-top:auto}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.result h2{font-size:56px;text-align:center;letter-spacing:.1em}
.result.win h2{color:var(--brass)} .result.lose h2{color:var(--hp)}
.result p{text-align:center}
.rules ol{margin:0;padding-left:1.3em;display:grid;gap:8px;line-height:1.65;font-size:13px}
.rules dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin:0}
.rules dt{color:var(--brass);font-weight:700}
.rules dd{margin:0;color:#d4cee2}

@media (max-width:900px){
  .game{grid-template-columns:minmax(0,1fr)}
  .sidebar{display:none}
  .sidebar.open{display:flex;position:fixed;top:0;right:0;bottom:0;width:min(330px,88vw);z-index:40;box-shadow:-20px 0 40px rgba(0,0,0,.5);padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .showlog{display:inline-block}
}
@media (max-width:560px){
  .row{gap:5px}
  .unit{padding:4px 3px 3px}
  .unit .nm{font-size:9.5px}
  .atk,.hp{font-size:14px;min-width:18px;height:19px}
  .leader{width:46px;height:46px}.leader .hpv{font-size:23px}
  .hcard{width:68px;height:96px}
  .abar{max-height:112px}
  .turninfo .opt{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
'use strict';
/* ================= util ================= */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];
const rnd=(a,k)=>shuffle([...a]).slice(0,k);
const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));

const CLS={elf:{n:'エルフ',k:'森'},royal:{n:'ロイヤル',k:'剣'},dragon:{n:'ドラゴン',k:'竜'},nemesis:{n:'ネメシス',k:'機'},neutral:{n:'ニュートラル',k:'無'}};
const KW={ward:'守護',storm:'疾走',rush:'突進',bane:'必殺',drain:'ドレイン',barrier:'バリア',intim:'威圧',aura:'オーラ'};
const RAR={B:'ブロンズ',S:'シルバー',G:'ゴールド',L:'レジェンド'};
const TY={F:'フォロワー',S:'スペル',A:'アミュレット'};
const HAND_MAX=9, BOARD_MAX=5;

/* ================= engine helpers ================= */
let G=null, UID=0;
const P=i=>G.p[i], E=i=>1-i, L=i=>G.p[i].leader;
const foll=i=>G.p[i].board.filter(c=>c.d.t==='F');
const efx=i=>foll(E(i)).filter(c=>!c.kw.has('aura'));
const awake=i=>P(i).ppMax>=7;
const onBoard=c=>!!c&&!c.isLeader&&P(c.owner).board.includes(c);
const isLive=t=>!!t&&(t.isLeader||onBoard(t));
function log(s,cls){G.log.unshift({s,cls});if(G.log.length>120)G.log.pop()}
function fx(uid,text,kind){G.fx.push({uid,text,kind})}
function ctxOf(c){return {i:c.owner,self:c,combo:P(c.owner).combo}}

function damage(t,n){
  if(n<=0||!isLive(t))return 0;
  if(t.isLeader){const p=P(t.owner);p.hp-=n;fx(t.uid,'-'+n,'dmg');checkWin();return n}
  if(t.sevo&&G.active===t.owner){fx(t.uid,'無効','imm');return 0}
  if(t.kw.has('barrier')){t.kw.delete('barrier');fx(t.uid,'バリア','imm');log(`${t.name} のバリアがダメージを防いだ`);return 0}
  t.hp-=n;fx(t.uid,'-'+n,'dmg');return n;
}
const tdmg=(x,n)=>{if(isLive(x.target))damage(x.target,n)};
const dmgEach=(list,n)=>list.forEach(t=>damage(t,n));
function heal(i,n){const p=P(i);const v=Math.min(n,p.maxHp-p.hp);if(v>0){p.hp+=v;fx(L(i).uid,'+'+v,'heal')}return v}
function ramp(i,n){const p=P(i);const v=Math.min(n,10-p.ppMax);p.ppMax+=v;if(v)log(`${p.name} のPP最大値+${v}`)}
function rec(i,n){const p=P(i);p.pp=Math.min(p.ppMax,p.pp+n);log(`${p.name} のPPを${n}回復`)}
function buff(c,a,h){if(!onBoard(c))return;c.atk+=a;c.hp+=h;c.maxHp+=h;fx(c.uid,`+${a}/+${h}`,'buff')}
function destroy(c){if(!onBoard(c))return;if(c.sevo&&G.active===c.owner){fx(c.uid,'無効','imm');return}c.dead=true}
function banish(c){if(!onBoard(c))return;if(c.sevo&&G.active===c.owner){fx(c.uid,'無効','imm');return}const b=P(c.owner).board;b.splice(b.indexOf(c),1);log(`${c.name} は消滅した`)}
function cdown(c,n){if(c.cd==null)return;c.cd=Math.max(0,c.cd-n);fx(c.uid,'-'+n,'cd')}
const flags=i=>P(i).board.filter(c=>c.name==='戦慄の海賊旗');
function toHand(i,c){const p=P(i);if(p.hand.length>=HAND_MAX){p.grave++;log(`${p.name} の手札がいっぱいで「${c.name}」は破棄された`);return}p.hand.push(c)}
function add(i,n,k=1){for(let j=0;j<k;j++)toHand(i,inst(n,i))}
function summon(i,n,k=1){const p=P(i);for(let j=0;j<k;j++){if(p.board.length>=BOARD_MAX){log(`場がいっぱいで「${n}」を出せなかった`);break}const c=inst(n,i);c.newly=true;p.board.push(c)}}
function tutor(i,f){const p=P(i);const m=p.deck.filter(f);if(!m.length)return;const c=pick(m);p.deck.splice(p.deck.indexOf(c),1);toHand(i,c);log(`${p.name} はデッキからカードを1枚引いた`)}
function draw(i,n){const p=P(i);for(let k=0;k<n;k++){if(G.over)return;if(!p.deck.length){G.over={winner:E(i),reason:`${p.name} の山札が尽きた`};log(`${p.name} は山札が尽きた`);return}toHand(i,p.deck.pop())}}
function gainCrest(i,cr){const p=P(i);if(p.crests.some(c=>c.name===cr.name)){const ex=p.crests.find(c=>c.name===cr.name);if(cr.cd!=null)ex.cd=cr.cd;return}p.crests.push(cr);log(`${p.name} は『クレスト：${cr.name}』を得た`)}

/* ================= card database ================= */
const DB={};
function C(d){d.kw=d.kw||[];d.r=d.r||'B';d.tx=d.tx||'';DB[d.n]=d}
function inst(name,owner){const d=DB[name];if(!d)throw new Error('unknown card '+name);
  return {uid:'c'+(++UID),name,d,owner,cost:d.cost,atk:d.a||0,hp:d.h||0,maxHp:d.h||0,kw:new Set(d.kw),evolved:false,sevo:false,newly:false,attacked:false,cd:d.cd}}

/* ================= rules ================= */
function newPlayer(i,key,name){
  const dk=DECKS[key];
  const p={i,name,deckKey:key,cls:dk.cls,hp:20,maxHp:20,pp:0,ppMax:0,ep:2,sep:2,evoUsed:false,turn:0,combo:0,second:false,xpE:false,xpL:false,
    crests:[],hand:[],board:[],deck:[],grave:0,leader:{isLeader:true,owner:i,uid:'L'+i}};
  for(const [n,c] of dk.list)for(let k=0;k<c;k++)p.deck.push(inst(n,i));
  shuffle(p.deck);return p;
}
function checkWin(){if(G.over)return;const a=G.p[0].hp<=0,b=G.p[1].hp<=0;if(a||b)G.over={winner:a&&b?-1:a?1:0,reason:'リーダーの体力が0になった'}}
function resolveDeaths(){
  for(let guard=0;guard<30;guard++){
    const dying=[];
    for(const p of G.p)for(const c of p.board){if(c.dead||(c.d.t==='F'&&c.hp<=0)||(c.d.t==='A'&&c.cd!=null&&c.cd<=0))dying.push(c)}
    if(!dying.length)break;
    for(const c of dying){const p=P(c.owner);p.board.splice(p.board.indexOf(c),1);p.grave++;log(`${c.name} は破壊された`)}
    for(const c of dying)if(c.d.lw){log(`${c.name} のラストワード`);c.d.lw(ctxOf(c))}
  }
  checkWin();
}
function targets(i,spec,self){
  if(!spec)return [];
  const ef=efx(i);
  if(spec==='ef')return ef;
  if(spec==='ec')return [...ef,L(E(i))];
  if(spec==='af')return foll(i).filter(c=>c!==self);
  return [];
}
const effCost=(p,c)=>(c.d.enh&&p.pp>=c.d.enh.n)?c.d.enh.n:c.cost;
function playBlock(i,c){
  const p=P(i);
  if(G.over)return '対戦は終了しています';
  if(G.active!==i)return '相手のターンです';
  if(p.pp<c.cost)return 'PPが足りません';
  if(c.d.t!=='S'&&p.board.length>=BOARD_MAX)return '場がいっぱいです（5枠）';
  if(c.d.t==='S'&&c.d.tgt&&!targets(i,c.d.tgt,c).length)return '対象にできるフォロワーがいません';
  return '';
}
const canPlay=(i,c)=>!playBlock(i,c);
function play(i,c,target){
  const p=P(i);const enh=!!(c.d.enh&&p.pp>=c.d.enh.n);const cost=enh?c.d.enh.n:c.cost;
  p.pp-=cost;p.hand.splice(p.hand.indexOf(c),1);p.combo++;
  log(`${p.name}：「${c.name}」をプレイ${enh?'（エンハンス）':''}${target&&!target.isLeader?` → ${target.name}`:''}`);
  const x={i,self:c,target,enh,combo:p.combo};
  if(c.d.t==='S'){
    c.d.sp&&c.d.sp(x);p.grave++;resolveDeaths();
    for(const b of [...p.board])if(onBoard(b)&&b.d.onSpell)b.d.onSpell(ctxOf(b));
  }else{
    c.newly=true;c.attacked=false;p.board.push(c);
    c.d.ff&&c.d.ff(x);if(enh&&c.d.enh.fn)c.d.enh.fn(x);
  }
  resolveDeaths();
  if(c.d.t==='F'&&onBoard(c))for(const cr of [...p.crests])cr.onPlayF&&cr.onPlayF(i,c,cr);
  resolveDeaths();
}
const evoNeed=(p,sup)=>sup?(p.second?6:7):(p.second?4:5);
function evoBlock(i,c,sup){
  const p=P(i);
  if(G.active!==i||G.over)return '自分のターンのみ';
  if(c.d.t!=='F'||c.owner!==i)return '';
  if(c.evolved)return '進化済み';
  if(p.turn<evoNeed(p,sup))return `自分の${evoNeed(p,sup)}ターン目から`;
  if(p.evoUsed)return 'このターンは進化済み';
  if(sup?p.sep<=0:p.ep<=0)return sup?'SEPがありません':'EPがありません';
  return '';
}
const canEvolve=(i,c,sup)=>onBoard(c)&&!evoBlock(i,c,sup);
function evolve(i,c,sup,free,target){
  const p=P(i);
  if(!free){p.evoUsed=true;if(sup)p.sep--;else p.ep--}
  c.evolved=true;const b=sup?3:2;c.atk+=b;c.hp+=b;c.maxHp+=b;
  if(sup){c.sevo=true;c.kw.add('rush')}
  fx(c.uid,sup?'超進化':'進化','buff');
  log(`${p.name}：「${c.name}」を${sup?'超進化':'進化'}${free?'（クレスト）':''}`);
  const x={i,self:c,target,combo:p.combo};
  c.d.evo&&c.d.evo(x);
  if(sup&&c.d.sevo)c.d.sevo(x);
  resolveDeaths();
}
const canAtkF=c=>c.owner===G.active&&c.d.t==='F'&&!c.attacked&&c.atk>0&&(!c.newly||c.kw.has('storm')||c.kw.has('rush')||c.evolved);
const canAtkL=c=>c.owner===G.active&&c.d.t==='F'&&!c.attacked&&c.atk>0&&(!c.newly||c.kw.has('storm'));
function atkTargets(c){
  if(!onBoard(c)||G.over||!canAtkF(c))return [];
  const e=E(c.owner);const ef=foll(e).filter(x=>!x.kw.has('intim'));
  const wards=ef.filter(x=>x.kw.has('ward'));
  if(wards.length)return wards;
  const r=[...ef];if(canAtkL(c))r.push(L(e));return r;
}
function attack(a,t){
  a.attacked=true;
  log(`${a.name} が ${t.isLeader?P(t.owner).name+'のリーダー':t.name} を攻撃`);
  if(t.isLeader){const d=damage(t,a.atk);if(a.kw.has('drain')&&d)heal(a.owner,d)}
  else{
    const da=a.atk,dt=t.atk;
    const dealt=damage(t,da);const taken=damage(a,dt);
    if(a.kw.has('bane')&&dealt>0)t.dead=true;
    if(t.kw.has('bane')&&taken>0)a.dead=true;
    if(a.kw.has('drain')&&dealt)heal(a.owner,dealt);
  }
  resolveDeaths();
}
function startTurn(i){
  G.active=i;G.turnNo++;const p=P(i);
  p.turn++;if(p.ppMax<10)p.ppMax++;p.pp=p.ppMax;p.evoUsed=false;p.combo=0;
  log(`${p.name} のターン ${p.turn}`,'t');
  for(const c of p.board){c.newly=false;c.attacked=false}
  for(const c of p.board)if(c.d.t==='A'&&c.cd!=null)cdown(c,1);
  for(const cr of p.crests)if(cr.cd!=null)cr.cd--;
  p.crests=p.crests.filter(cr=>cr.cd==null||cr.cd>0);
  for(const c of [...p.board])if(onBoard(c)&&c.d.onStart)c.d.onStart(ctxOf(c));
  resolveDeaths();if(G.over)return;
  draw(i,1);
}
function endTurn(i){
  const p=P(i);
  for(const c of [...p.board])if(onBoard(c)&&c.d.onEnd)c.d.onEnd(ctxOf(c));
  resolveDeaths();
  for(const cr of [...p.crests])cr.onEnd&&cr.onEnd(i);
  for(const c of [...P(E(i)).board])if(onBoard(c)&&c.d.onOppEnd)c.d.onOppEnd(ctxOf(c));
  resolveDeaths();
  if(G.over)return;
  startTurn(E(i));
}
const canExtra=i=>{const p=P(i);return p.second&&G.active===i&&!G.over&&(p.turn<=5?!p.xpE:!p.xpL)};
function useExtra(i){const p=P(i);p.pp++;if(p.turn<=5)p.xpE=true;else p.xpL=true;log(`${p.name} はエクストラPPを使用（このターンPP+1）`)}
function mulligan(i,cards){const p=P(i);for(const c of cards)p.hand.splice(p.hand.indexOf(c),1);for(let k=0;k<cards.length;k++)p.hand.push(p.deck.pop());p.deck.push(...cards);shuffle(p.deck)}

/* ================= CPU ================= */
const val=t=>t.atk*1.5+t.hp+(t.kw.has('ward')?1:0)+(t.evolved?2:0)+(t.d.onEnd?4:0)+(t.d.r==='L'?2:0);
function aiTarget(i,spec,self,hint){
  if(!spec)return undefined;
  const ts=targets(i,spec,self);if(!ts.length)return undefined;
  hint=hint||{};
  if(spec==='af')return ts.slice().sort((a,b)=>(b.atk+b.hp+(b.attacked?0:2))-(a.atk+a.hp+(a.attacked?0:2)))[0];
  const fs=ts.filter(t=>!t.isLeader);
  if(hint.dmg!=null){const n=typeof hint.dmg==='function'?hint.dmg(i):hint.dmg;
    const k=fs.filter(t=>t.hp<=n&&!t.kw.has('barrier')&&!(t.sevo&&G.active===t.owner));if(k.length)return k.sort((a,b)=>val(b)-val(a))[0]}
  if(!fs.length)return ts[0];
  return fs.sort((a,b)=>val(b)-val(a))[0];
}
function aiWants(i,c){
  if(c.name==='バハムート'){const mine=foll(i).reduce((s,x)=>s+val(x),0),theirs=foll(E(i)).reduce((s,x)=>s+val(x),0);return theirs>mine+6}
  if(c.d.t==='S'&&c.d.tgt==='ef'&&c.d.ai&&c.d.ai.dmg!=null){const t=aiTarget(i,'ef',c,c.d.ai);return !!t&&(t.atk>=2||t.hp<=(typeof c.d.ai.dmg==='function'?c.d.ai.dmg(i):c.d.ai.dmg))}
  if(c.name==='エンジェルバレッジ'||c.name==='一斉砲火'||c.name==='無限の検算')return foll(E(i)).length>=2;
  return true;
}
function aiBest(i){
  const p=P(i);const list=p.hand.filter(c=>canPlay(i,c)&&aiWants(i,c));
  if(!list.length)return {sum:0,set:[]};
  const slots=BOARD_MAX-p.board.length;let best={v:-1,sum:0,set:[]};
  const n=Math.min(list.length,10);
  for(let m=1;m<(1<<n);m++){let sum=0,cnt=0,bodies=0,leg=0;const set=[];
    for(let k=0;k<n;k++)if(m>>k&1){const c=list[k];sum+=c.cost;cnt++;if(c.d.t!=='S')bodies++;if(c.d.r==='L')leg++;set.push(c)}
    if(sum>p.pp||bodies>slots)continue;
    const v=sum*10+cnt*2+leg;if(v>best.v)best={v,sum,set};}
  return best;
}
const ord=c=>c.cost+(c.d.combo?20+c.d.combo*2:0)+(c.name==='逆行の咎人バルバロス'||c.name==='森の女王'?60:0)+(c.d.t==='S'&&c.d.tgt==='ef'?-10:0)+(c.d.tgt==='af'?30:0)+(c.d.t==='A'?-5:0);
function aiChoosePlay(i){
  const p=P(i);
  const en=p.hand.find(c=>c.d.enh&&p.pp>=c.d.enh.n&&canPlay(i,c)&&p.board.length<BOARD_MAX);
  if(en)return en;
  const b=aiBest(i);if(!b.set.length)return null;
  return b.set.sort((a,c)=>ord(a)-ord(c))[0];
}
function aiExtraHelps(i){const p=P(i);const s0=aiBest(i).sum;p.pp++;const s1=aiBest(i).sum;p.pp--;return s1>s0}
function aiEvolve(i){
  const enemyF=foll(E(i)).length;
  for(const sup of [true,false]){
    const cs=foll(i).filter(c=>canEvolve(i,c,sup));if(!cs.length)continue;
    const sc=c=>(c.d.evo?4:0)+(sup&&c.d.sevo?4:0)+(c.newly&&!c.kw.has('storm')&&!c.kw.has('rush')&&enemyF?3:0)+c.atk*.4+(c.d.etgt&&targets(i,c.d.etgt,c).length?3:0)-(c.d.tok?2:0)+(c.name==='束刃の咎人・カットスロート'?6:0);
    cs.sort((a,b)=>sc(b)-sc(a));const c=cs[0];
    if(sc(c)<2&&!enemyF)continue;
    return {c,sup};
  }
  return null;
}
function aiPickAttack(i){
  const e=E(i);const atk=foll(i).filter(c=>atkTargets(c).length);if(!atk.length)return null;
  const eh=P(e).hp;const wards=foll(e).filter(x=>x.kw.has('ward')&&!x.kw.has('intim'));
  if(!wards.length){const face=atk.filter(canAtkL).reduce((s,c)=>s+c.atk,0);if(face>=eh){return {att:atk.find(canAtkL),tgt:L(e)}}}
  let best=null;
  for(const a of atk)for(const t of atkTargets(a)){
    let s;
    if(t.isLeader)s=a.atk+(eh<=10?a.atk*.6:0);
    else{
      const kills=!t.kw.has('barrier')&&(a.atk>=t.hp||a.kw.has('bane'));
      const dies=!a.sevo&&!a.kw.has('barrier')&&(t.atk>=a.hp||(t.kw.has('bane')&&t.atk>0));
      s=(kills?val(t)+2:-2)-(dies?val(a):0)+(kills&&!dies?4:0)+(t.kw.has('ward')&&kills?2:0);
    }
    if(!best||s>best.s)best={att:a,tgt:t,s};
  }
  return best&&best.s>0?best:null;
}
async function aiTurn(){
  const g=G,i=1;g.busy=true;UI.sel=null;UI.tgt=null;
  const alive=()=>G===g&&!g.over;
  const step=async ms=>{render();await sleep(ms);return alive()};
  const fin=()=>{if(G===g){g.busy=false;render()}};
  if(!await step(650))return fin();
  if(canExtra(i)&&aiExtraHelps(i)){useExtra(i);if(!await step(450))return fin()}
  for(let k=0;k<14;k++){const c=aiChoosePlay(i);if(!c)break;play(i,c,aiTarget(i,c.d.tgt,c,c.d.ai));if(!await step(850))return fin()}
  const ev=aiEvolve(i);
  if(ev){evolve(i,ev.c,ev.sup,false,aiTarget(i,ev.c.d.etgt,ev.c,ev.c.d.eai));if(!await step(850))return fin()}
  for(let k=0;k<12;k++){const a=aiPickAttack(i);if(!a)break;attack(a.att,a.tgt);if(!await step(700))return fin()}
  for(let k=0;k<6;k++){const c=aiChoosePlay(i);if(!c)break;play(i,c,aiTarget(i,c.d.tgt,c,c.d.ai));if(!await step(750))return fin()}
  if(!alive())return fin();
  endTurn(i);g.busy=false;render();
}

let lastMatch=null;
function newGame(pickKey,oppKey){
  UID=0;
  const ok=oppKey||(UI.opp==='random'?pick(Object.keys(DECKS)):UI.opp);
  const pk=pickKey||UI.pick;lastMatch=[pk,ok];
  G={p:[newPlayer(0,pk,'あなた'),newPlayer(1,ok,'CPU')],turnNo:0,active:-1,first:Math.random()<.5?0:1,log:[],fx:[],over:null,busy:false};
  G.p[E(G.first)].second=true;
  for(const p of G.p)for(let k=0;k<4;k++)p.hand.push(p.deck.pop());
  log(`${G.first===0?'あなた':'CPU'} が先攻`,'t');

  mulligan(0,P(0).hand.filter(c=>UI.mull.has(c.uid)));
  const back=P(1).hand.filter(c=>c.cost>=5&&!c.d.enh);mulligan(1,back);
  log(`あなたは${UI.mull.size}枚、CPUは${back.length}枚を引き直した`);
  UI.mull=null;
  startTurn(G.first);render();
  if(!G.over&&G.active===1)aiTurn();

function doPlay(c){
  if(G.busy||!canPlay(0,c))return;
  const spec=c.d.tgt;
  if(spec){const ts=targets(0,spec,c);if(ts.length){UI.tgt={mode:'play',card:c,valid:ts,label:c.name};UI.sel={kind:'hand',uid:c.uid};render();return}}
  UI.sel=null;play(0,c,undefined);render();
}
function doEvolve(c,sup){
  if(G.busy||!canEvolve(0,c,sup))return;
  if(c.d.etgt){const ts=targets(0,c.d.etgt,c);if(ts.length){UI.tgt={mode:'evo',card:c,sup,valid:ts,label:`${c.name}（${sup?'超進化':'進化'}時）`};render();return}}
  evolve(0,c,sup,false,undefined);render();
}
function resolveTgt(t){
  const T=UI.tgt;UI.tgt=null;UI.sel=null;
  if(T.mode==='play'){if(P(0).hand.includes(T.card)&&canPlay(0,T.card))play(0,T.card,t)}
  else if(canEvolve(0,T.card,T.sup))evolve(0,T.card,T.sup,false,t);
  render();
}
function clickObj(o){
  if(UI.tgt){if(UI.tgt.valid.includes(o))resolveTgt(o);return true}
  const s=selObj();
  if(s&&UI.sel.kind==='board'&&s.owner===0&&o.owner===1&&G.active===0&&!G.busy&&atkTargets(s).includes(o)){attack(s,o);UI.sel=null;render();return true}
  return false;
}
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-hand],[data-board],[data-leader],[data-deck],[data-opp],[data-mull]');
  if(!el)return;
  if(el.dataset.act==='closerules'&&e.target.closest('[data-stop]')&&!e.target.closest('button'))return;
  const a=el.dataset.act;
  if(el.dataset.deck){UI.pick=el.dataset.deck;render();return}
  if(el.dataset.opp){UI.opp=el.dataset.opp;render();return}
  if(el.dataset.mull){const u=el.dataset.mull;UI.mull.has(u)?UI.mull.delete(u):UI.mull.add(u);render();return}
  if(a){
    switch(a){
      case 'start':newGame();break;
      case 'again':newGame(lastMatch[0],lastMatch[1]);break;
      case 'title':G=null;UI.screen='title';render();break;
      case 'rules':UI.rules=true;render();break;
      case 'closerules':UI.rules=false;render();break;
      case 'mulldone':finishMulligan();break;
      case 'cancel':UI.tgt=null;render();break;
      case 'log':UI.log=!UI.log;render();break;
      case 'surrender':if(!G.over){UI.confirm=true;render()}break;
      case 'surrender-no':UI.confirm=false;render();break;
      case 'surrender-yes':UI.confirm=false;if(!G.over){G.over={winner:1,reason:'投了'};G.busy=false}render();break;
      case 'play':{const c=selObj();if(c)doPlay(c);break}
      case 'evo':case 'sevo':{const c=selObj();if(c)doEvolve(c,a==='sevo');break}
      case 'xpp':if(canExtra(0)&&!G.busy){useExtra(0);render()}break;
      case 'end':if(G.active===0&&!G.busy&&!G.over){UI.sel=null;UI.tgt=null;endTurn(0);render();if(!G.over&&G.active===1)aiTurn()}break;
    }
    return;
  }
  if(!G||G.over)return;
  if(el.dataset.hand){
    const c=find(el.dataset.hand);if(!c)return;
    if(UI.tgt)return;
    if(UI.sel&&UI.sel.uid===c.uid&&canPlay(0,c)&&!G.busy){doPlay(c);return}
    UI.sel={kind:'hand',uid:c.uid};render();return;
  }
  if(el.dataset.board){
    const c=find(el.dataset.board);if(!c)return;
    if(clickObj(c))return;
    UI.sel=(UI.sel&&UI.sel.uid===c.uid)?null:{kind:'board',uid:c.uid};render();return;
  }
  if(el.dataset.leader){const o=L(+el.dataset.leader);if(clickObj(o))return;UI.sel=null;render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.screen==='game'){UI.tgt=null;UI.sel=null;UI.rules=false;UI.confirm=false;render()}});
render();
</script>
