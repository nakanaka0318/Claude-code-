<title>両隣、おじさん。</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* Layout: 終電の車内を一枚の舞台に。上に行先LED、下は座席の三人。単一の夜の世界観で固定 */
:root {
  --night: #0a0e1c;
  --panel: #10131f;
  --ink: #f2eee3;
  --ink-dim: #a7a99f;
  --led: #ff9324;
  --led-dim: #3b2510;
  --seat: #2d5a48;
  --f-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-led: "DotGothic16", "MS Gothic", monospace;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--ink); font-family: var(--f-body);
  overflow: hidden; -webkit-user-select: none; user-select: none;
  touch-action: manipulation; -webkit-tap-highlight-color: transparent;
}
#app { height: 100%; display: flex; flex-direction: column; }

/* 行先LED */
.led {
  background: #050505; border-bottom: 3px solid #23242a;
  padding-block: 10px 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-family: var(--f-led); color: var(--led);
  text-shadow: 0 0 6px rgba(255,147,36,.55);
  display: flex; flex-direction: column; gap: 6px;
}
.led-row { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.led-label { font-size: 13px; letter-spacing: .1em; flex: none; }
.led-name { font-size: clamp(22px, 6vw, 30px); line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.led-roma { font-size: 12px; opacity: .75; white-space: nowrap; flex: none; }
.led-right { margin-left: auto; font-size: 13px; white-space: nowrap; flex: none; font-variant-numeric: tabular-nums; }
.led.warn .led-name { animation: ledblink .25s steps(2) infinite; color: #ffcf3a; }
@keyframes ledblink { 50% { opacity: .25; } }
.line { list-style: none; margin: 0; padding: 0; display: flex; align-items: center; gap: 0; }
.line li { flex: 1; height: 2px; background: var(--led-dim); position: relative; }
.line li::after {
  content: ""; position: absolute; right: -4px; top: -3px; width: 8px; height: 8px; border-radius: 50%;
  background: #050505; border: 1.5px solid var(--led-dim);
}
.line li.done { background: var(--led); }
.line li.done::after { background: var(--led); border-color: var(--led); }
.line li.now::after { border-color: var(--led); animation: ledblink .6s steps(2) infinite; }
.line li.mine::after { width: 12px; height: 12px; top: -5px; right: -6px; border-color: #ffcf3a; }

/* 舞台 */
#stage { position: relative; flex: 1; min-height: 0; overflow: hidden; cursor: pointer; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hints {
  position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
.hint {
  width: 74px; height: 74px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(10,14,28,.42); border: 2px solid rgba(242,238,227,.35);
  font-family: var(--f-display); font-size: 28px; color: var(--ink);
  transition: transform .08s, background .08s;
}
.hint.on { background: var(--led); color: #1b0f02; transform: scale(.9); border-color: var(--led); }
#pop {
  position: absolute; left: 50%; top: 22%; transform: translate(-50%, 0);
  font-family: var(--f-display); font-size: clamp(26px, 8vw, 44px); color: var(--ink);
  -webkit-text-stroke: 2px #0a0e1c; paint-order: stroke fill; white-space: nowrap;
  pointer-events: none; opacity: 0;
}
#pop.go { animation: pop .9s ease-out; }
#pop.safe { color: #7ef0b0; }
#pop.bad { color: #ffcf3a; }
@keyframes pop {
  0% { opacity: 0; transform: translate(-50%, 10px) scale(.6); }
  15% { opacity: 1; transform: translate(-50%, 0) scale(1.08); }
  70% { opacity: 1; transform: translate(-50%, -6px) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -24px) scale(1); }
}

/* オーバーレイ */
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(to bottom, rgba(10,14,28,.15), rgba(10,14,28,.78) 55%);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-y: auto; cursor: default;
}
.sheet {
  width: 100%; max-width: 440px; margin: auto;
  background: rgba(14,17,29,.92); border: 1px solid #2a2d3c; border-radius: 16px;
  padding: 22px 20px 20px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}
.eyebrow { font-family: var(--f-led); color: var(--led); font-size: 13px; letter-spacing: .08em; }
h1 {
  margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 12vw, 58px);
  line-height: 1.02; letter-spacing: -.01em; text-wrap: balance;
}
h1 em { font-style: normal; color: var(--led); }
h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(26px, 7.5vw, 34px); line-height: 1.15; text-wrap: balance; }
.lead { margin: 0; font-size: 15px; line-height: 1.75; color: var(--ink); }
.lead b { color: var(--led); font-weight: 700; }
.how {
  display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-dim);
  border-top: 1px dashed #2f3243; padding-top: 12px;
}
.key {
  font-family: var(--f-led); color: var(--ink); border: 1px solid #3a3d50; border-radius: 6px;
  padding: 2px 8px; background: #181b29; flex: none;
}
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1 1 140px; appearance: none; border: 0; border-radius: 999px; cursor: pointer;
  font-family: var(--f-body); font-weight: 900; font-size: 17px; padding: 15px 18px;
  background: var(--led); color: #1b0f02; text-align: center; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .1s, filter .1s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 3px solid #ffcf3a; outline-offset: 3px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid #3a3d50; }
.btn.x { background: var(--ink); color: #0a0e1c; }
.best { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: #161927; border-radius: 10px; padding: 10px 8px; text-align: center; }
.stat b { display: block; font-family: var(--f-display); font-weight: 400; font-size: 24px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--ink-dim); letter-spacing: .05em; }
.rank {
  align-self: flex-start; font-family: var(--f-led); font-size: 15px; color: #1b0f02;
  background: #ffcf3a; padding: 4px 12px; border-radius: 6px;
}
.quote { margin: 0; font-size: 14px; color: var(--ink-dim); line-height: 1.7; }
.mute {
  position: absolute; top: 10px; right: max(12px, env(safe-area-inset-right, 0px));
  appearance: none; border: 1px solid #3a3d50; background: rgba(10,14,28,.6); color: var(--ink);
  font-family: var(--f-led); font-size: 12px; border-radius: 999px; padding: 6px 12px; cursor: pointer; z-index: 3;
}
#result { align-items: flex-end; background: linear-gradient(to bottom, rgba(10,14,28,0) 30%, rgba(10,14,28,.7)); }
#result .sheet { margin: auto auto 0; gap: 10px; padding: 18px 18px 16px; }
#result h2 { font-size: clamp(22px, 6.4vw, 30px); }
@media (max-width: 460px) { .led-roma { display: none; } }
.toast { font-size: 12px; color: #7ef0b0; min-height: 1em; }
@media (prefers-reduced-motion: reduce) {
  #pop.go { animation-duration: .01s; }
  .led.warn .led-name, .line li.now::after { animation: none; }
}
</style>

<div id="app">
  <header class="led" id="led">
    <div class="led-row">
      <span class="led-label" id="ledLabel">23:58発</span>
      <span class="led-name" id="ledName">布団ヶ原 行</span>
      <span class="led-roma" id="ledRoma">for Futon-ga-hara</span>
      <span class="led-right" id="ledRight">各駅停車</span>
    </div>
    <ol class="line" id="line" aria-hidden="true"></ol>
  </header>

  <main id="stage">
    <canvas id="cv" aria-label="終電の座席。中央があなた、左右におじさん。"></canvas>
    <div class="hints" id="hints" hidden><div class="hint" id="hL">←</div><div class="hint" id="hR">→</div></div>
    <div id="pop"></div>
    <button class="mute" id="mute" type="button">音 ON</button>

    <section class="overlay" id="title">
      <div class="sheet">
        <div class="eyebrow">終電 23:58発 ／ 各駅停車 布団ヶ原行</div>
        <h1>両隣、<br><em>おじさん。</em></h1>
        <p class="lead">残業明けの終電。まぶたが落ちて、首がカクンと傾く。左に<b>部長っぽいおじさん</b>、右に<b>ジム帰りのおじさん</b>。どちらの肩にも寄りかからずに、降りる駅『二度寝』まで耐えろ。</p>
        <div class="how"><span class="key">← →</span><span>首が傾いた<strong>反対側</strong>をタップ。揺れ・カーブ・まぶたに注意。</span></div>
        <div class="btns"><button class="btn" id="start" type="button">乗車する</button></div>
        <div class="best" id="bestTitle"></div>
      </div>
    </section>

    <section class="overlay" id="result" hidden>
      <div class="sheet">
        <div class="eyebrow" id="rEyebrow"></div>
        <h2 id="rHead"></h2>
        <p class="quote" id="rQuote"></p>
        <div class="stats">
          <div class="stat"><b id="rStations">0</b><span>耐えた駅</span></div>
          <div class="stat"><b id="rNear">0</b><span>九死に一生</span></div>
          <div class="stat"><b id="rTaps">0</b><span>首の抵抗</span></div>
        </div>
        <div class="rank" id="rRank"></div>
        <div class="btns">
          <a class="btn x" id="share" href="#" target="_blank" rel="noopener">𝕏 でポスト</a>
          <button class="btn ghost" id="copy" type="button">結果をコピー</button>
        </div>
        <div class="btns"><button class="btn" id="retry" type="button">次の終電に乗る</button></div>
        <div class="toast" id="toast"></div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const cv = $('#cv'), ctx = cv.getContext('2d'), stage = $('#stage');

const STATIONS = [
  ['肩寄町', 'Katayose-chō'], ['首振坂', 'Kubifuri-zaka'], ['舟漕ぎ', 'Funakogi'],
  ['うとうと台', 'Utouto-dai'], ['半目橋', 'Hanme-bashi'], ['よだれ川', 'Yodare-gawa'],
  ['二度寝', 'Nidone'], ['白目ヶ丘', 'Shirome-ga-oka'], ['夢見野', 'Yumemino'],
  ['寝過ごし', 'Nesugoshi'], ['車庫前', 'Shako-mae'], ['布団ヶ原', 'Futon-ga-hara'],
];
const N = STATIONS.length, MINE = 6, RUN = 6.4, STOP = 2.4;
const WHO = { '-1': '左の部長っぽいおじさん', '1': '右のジム帰りおじさん' };
const REACT = {
  '-1': ['……（そっと肩を貸してくれた）', '「……うちの娘も、こんな感じでね」'],
  '1': ['（大胸筋で優しく受け止められた）', '「いい首の角度だ。プロテイン飲むか？」'],
};

/* ---------- 乱数・建物 ---------- */
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = mulberry(5813);
const BUILD = []; let BLEN = 0;
for (let i = 0; i < 34; i++) {
  const w = 40 + R() * 80, h = 40 + R() * 150, cols = Math.floor(w / 13), rows = Math.floor(h / 15);
  const lit = []; for (let k = 0; k < cols * rows; k++) lit.push(R() < .32);
  BUILD.push({ w, h, cols, rows, lit, c: ['#141a33', '#18203c', '#10162b'][i % 3] });
  BLEN += w + 5;
}
const FAR = []; for (let i = 0; i < 70; i++) FAR.push({ x: R() * 1600, y: R(), r: .8 + R() * 1.6, a: .3 + R() * .6 });
const rand = (a, b) => a + Math.random() * (b - a);
const gauss = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 状態 ---------- */
let g;
function fresh(state) {
  return { state, t: 0, th: 0, om: 0, noise: 0, d: .15, idx: 0, phase: 'run', pt: 0, dist: 0, speed: 1,
    ev: null, evTorque: 0, nextEv: 2.5, blink: 0, sway: 0, shake: 0, armed: false, near: 0, taps: 0,
    fallDir: 0, fallT: 0, shown: false, rail: 0, zs: [], ride: 0, awake: false, flash: 0 };
}
g = fresh('title');

/* ---------- 音 ---------- */
let AC = null, muted = false, NB = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, o = {}) {
  if (muted) return; const a = ac(); if (!a) return;
  const t0 = a.currentTime + (o.delay || 0), osc = a.createOscillator(), gn = a.createGain();
  osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
  gn.gain.setValueAtTime(.0001, t0); gn.gain.exponentialRampToValueAtTime(o.vol || .12, t0 + .012);
  gn.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  osc.connect(gn).connect(a.destination); osc.start(t0); osc.stop(t0 + dur + .03);
}
function thump(delay) {
  if (muted) return; const a = ac(); if (!a) return;
  if (!NB) { NB = a.createBuffer(1, a.sampleRate * .2, a.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length); }
  const t0 = a.currentTime + delay, s = a.createBufferSource(), f = a.createBiquadFilter(), gn = a.createGain();
  s.buffer = NB; f.type = 'lowpass'; f.frequency.value = 170;
  gn.gain.setValueAtTime(.55, t0); gn.gain.exponentialRampToValueAtTime(.001, t0 + .16);
  s.connect(f).connect(gn).connect(a.destination); s.start(t0);
}
const chime = () => { tone(1047, .5, { vol: .1 }); tone(784, .9, { vol: .1, delay: .36 }); };

/* ---------- LED・UI ---------- */
const led = $('#led'), line = $('#line');
for (let i = 0; i < N; i++) { const li = document.createElement('li'); if (i === MINE) li.classList.add('mine'); line.appendChild(li); }
function setLED(label, name, roma, right, warn) {
  $('#ledLabel').textContent = label; $('#ledName').textContent = name;
  $('#ledRoma').textContent = roma; $('#ledRight').textContent = right;
  led.classList.toggle('warn', !!warn);
}
function ledNext() {
  const [n, r] = STATIONS[g.idx];
  const left = N - g.idx;
  setLED('次は', n + (g.idx === MINE ? '（降車駅）' : ''), r, g.idx === N - 1 ? '終点' : `あと${left}駅`);
}
function paintLine() {
  [...line.children].forEach((li, i) => {
    li.classList.toggle('done', i < g.idx || (i === g.idx && g.phase === 'stop'));
    li.classList.toggle('now', i === g.idx && g.phase === 'run' && g.state === 'play');
  });
}
const pop = $('#pop');
function popText(t, cls = '') { pop.textContent = t; pop.className = ''; void pop.offsetWidth; pop.className = 'go ' + cls; }
function flashHint(dir) {
  const h = dir < 0 ? $('#hL') : $('#hR'); h.classList.add('on'); clearTimeout(h._t); h._t = setTimeout(() => h.classList.remove('on'), 90);
}
let best = 0; try { best = +localStorage.getItem('ryodonari-best') || 0; } catch (e) {}
function showBest() { $('#bestTitle').textContent = best ? `自己ベスト：${best} / ${N}駅` : ''; }
showBest();

/* ---------- ゲーム進行 ---------- */
function start() {
  ac(); g = fresh('play'); g.th = rand(-.06, .06); g.speed = 0;
  $('#title').hidden = true; $('#result').hidden = true; $('#hints').hidden = false;
  ledNext(); paintLine(); chime(); popText('発車します');
}
function push(dir) {
  if (g.state !== 'play') return;
  g.om = clamp(g.om + dir * 1.35, -5, 5); g.taps++; flashHint(dir);
  tone(dir < 0 ? 380 : 440, .05, { type: 'square', vol: .025 });
}
function startEvent(L) {
  const r = Math.random(), dir = Math.random() < .5 ? -1 : 1;
  if (r < .45) {
    g.ev = { type: 'curve', dir, t: 0, warn: .9, dur: 1.5, mag: 2.1 + 2.3 * L };
    setLED('注意', dir < 0 ? '◀◀ 左に揺れます' : '右に揺れます ▶▶', 'curve', '', true);
  } else if (r < .75) {
    g.ev = { type: 'nod', t: 0, dur: .6 };
    g.om += dir * (1.0 + 1.3 * L); g.shake = .4; popText('ガクッ', 'bad'); tone(160, .15, { type: 'triangle', vol: .12, to: 90 });
  } else {
    g.ev = { type: 'blink', t: 0, dur: 1.1 }; popText('まぶたが…', 'bad');
  }
  g.nextEv = g.t + rand(2.2, 4.2) * (1 - .35 * L) + 1.2;
}
function stepPlay(dt) {
  g.pt += dt; g.ride += dt;
  const L = g.idx / N;
  if (g.phase === 'run') {
    g.speed = Math.min(1, g.pt / 1.2);
    g.d = Math.min(1, g.d + dt * .02);
    if (!g.ev && g.pt > 1.2 && g.pt < RUN - 1.6 && g.t > g.nextEv) startEvent(L);
    if (g.pt >= RUN) {
      g.phase = 'stop'; g.pt = 0; g.d = Math.max(.1, g.d - .06); g.ev = null; g.evTorque = 0;
      const [n, r] = STATIONS[g.idx];
      chime();
      if (g.idx === MINE) { setLED('ただいま', n + '（降車駅）', r, 'ドアが閉まります', true); popText('体が動かない…', 'bad'); }
      else if (g.idx === MINE + 1) { setLED('ただいま', n, r, '延長戦', false); popText('降りる駅、過ぎた'); }
      else { setLED('ただいま', n, r, `${g.idx + 1}駅目`); popText(`${n}`, ''); }
      paintLine();
    }
  } else {
    const s = Math.max(0, 1 - g.pt / 1.1); g.speed = s * s;
    if (g.pt >= STOP) {
      g.idx++;
      if (g.idx >= N) return toClear();
      g.phase = 'run'; g.pt = 0; g.nextEv = g.t + rand(1.6, 3);
      ledNext(); paintLine();
    }
  }

  // イベント
  g.evTorque = 0; g.blink = 0;
  if (g.ev) {
    const e = g.ev; e.t += dt;
    if (e.type === 'curve') {
      if (e.t > e.warn) g.evTorque = e.dir * e.mag * Math.sin(Math.PI * Math.min(1, (e.t - e.warn) / e.dur));
      if (e.t > e.warn + e.dur) { g.ev = null; ledNext(); }
    } else if (e.type === 'blink') {
      g.blink = Math.sin(Math.PI * e.t / e.dur) * .9;
      if (e.t > e.dur) g.ev = null;
    } else if (e.t > e.dur) g.ev = null;
  }

  // 首の物理：倒立振子＋眠気ノイズ
  const calm = g.phase === 'stop' ? .55 : 1;
  const G = (1.3 + 2.4 * L + 1.4 * g.d) * calm;
  const sig = (.5 + 1.4 * L) * calm;
  g.noise += -g.noise * 1.2 * dt + sig * Math.sqrt(dt) * gauss() * 2;
  const tq = G * Math.sin(g.th) + g.noise + g.evTorque;
  g.om += (tq - 1.9 * g.om) * dt;
  g.om = clamp(g.om, -5, 5);
  g.th += g.om * dt;

  const a = Math.abs(g.th);
  if (a > .74) g.armed = true;
  if (g.armed && a < .3) { g.armed = false; g.near++; popText('セーフ！', 'safe'); tone(988, .12, { vol: .08 }); tone(1319, .14, { vol: .08, delay: .08 }); }
  if (a > 1.0) startFall();
}
function startFall() {
  g.state = 'fall'; g.fallDir = Math.sign(g.th) || 1; g.fallT = 0; g.shown = false; g.ev = null;
  $('#hints').hidden = true; led.classList.remove('warn');

  for (let s = -3; s <= 3; s++) {
    const sxp = s * 110; if (Math.abs(sxp) > LW / 2 - 30) continue;
    ctx.save(); ctx.translate(sxp, -434); ctx.rotate(-g.sway * 2.2 + Math.sin(g.t * 1.4 + s) * .04 * g.speed);
    ctx.fillStyle = '#e9e4d6'; ctx.fillRect(-4, 0, 8, 62);
    ctx.strokeStyle = '#efe9da'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(0, 78, 15, 0, 7); ctx.stroke();
    ctx.restore();
  }
}
function drawBench() {
  ctx.fillStyle = '#244c3c'; rr(-250, -178, 500, 182, 16); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.05)'; for (let i = -240; i < 250; i += 14) ctx.fillRect(i, -172, 5, 170);
  ctx.fillStyle = 'rgba(0,0,0,.18)'; [-82, 82].forEach(x => ctx.fillRect(x - 1, -170, 2, 166));
  ctx.fillStyle = '#2d5a48'; rr(-256, -12, 512, 42, 14); ctx.fill();
  ctx.fillStyle = '#376b55'; rr(-256, -12, 512, 12, [14, 14, 0, 0]); ctx.fill();
  [-266, 266].forEach(x => {
    ctx.fillStyle = '#c4c9c0'; rr(x - 10, -230, 20, 262, 10); ctx.fill();
    ctx.fillStyle = 'rgba(200,215,210,.25)'; rr(x + (x < 0 ? -50 : 10), -200, 40, 200, 8); ctx.fill();
  });
}

/* ---------- 描画 ---------- */
let W = 0, H = 0, DPR = 1;
function resize() {
  const r = stage.getBoundingClientRect(); DPR = Math.min(2, window.devicePixelRatio || 1);
  W = r.width; H = r.height; cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
}
window.addEventListener('resize', resize); resize();

function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#d6ddcf'; ctx.fillRect(0, 0, W, H);
  const u = Math.min(W / 640, H / 700), baseY = H * .7;
  LW = W / u;
  const top = -baseY / u, bottom = (H - baseY) / u;
  const sh = g.shake * 12;
  ctx.save();
  ctx.translate(W / 2 + (Math.random() - .5) * sh * u, baseY + (Math.random() - .5) * sh * u);
  ctx.scale(u, u);
  // 床
  ctx.fillStyle = '#7a7466'; ctx.fillRect(-LW / 2, 26, LW, bottom - 26 + 4);
  ctx.fillStyle = '#8a8474'; ctx.fillRect(-LW / 2, 26, LW, 10);
  ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-LW / 2, top, LW, 40);
  drawWindow(top);
  drawBench();
  const rL = clamp((-g.th - .35) / .6, 0, 1), rR = clamp((g.th - .35) / .6, 0, 1);
  const fallen = g.state === 'fall' || g.state === 'result';
  drawBucho(-150, rL, fallen && g.fallDir < 0);
  drawGym(150, rR, fallen && g.fallDir > 0);
  const P = drawPlayer();

  // Zzz
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  g.zs.forEach(z => {
    const k = z.t / 2.2;
    ctx.globalAlpha = Math.sin(Math.PI * k) * .9;
    ctx.font = `${Math.round(18 + 18 * k * z.s)}px ${FD}`;
    ctx.fillStyle = '#3c4a8a';
    ctx.fillText('Z', P.hx + 36 + z.dx * k + Math.sin(z.t * 4) * 6, P.hy - 50 - k * 110);
  });
  ctx.globalAlpha = 1;

  // 吹き出し
  if (g.state === 'play') {
    if (rL > .6) bubble(-150, -262, '…ん？', 20, 10);
    if (rR > .6) bubble(150, -262, 'おっ…？', 20, -10);
  } else if (fallen && g.fallT > .5) {
    if (g.fallDir < 0) bubble(-130, -262, '……（ポッ）', 22, 14);
    else bubble(130, -262, '……（ムキッ）', 22, -14);
  } else if (g.state === 'clear') {
    bubble(0, -282, '…え、ここどこ？', 22, 0);
  }
  ctx.restore();

  // まぶた
  const e = g.state === 'clear' ? 0 : clamp((g.state === 'title' ? .12 : .08 + g.d * .42) + g.blink - (fallen ? Math.min(.3, g.fallT * .5) : 0), 0, 1);
  if (e > 0.01) {
    const cy = clamp(baseY + P.hy * u, H * .25, H * .75);
    const topEdge = cy * e, botEdge = H - (H - cy) * e, bulge = 40 * u + 30;
    ctx.fillStyle = 'rgba(6,7,12,.96)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, topEdge - bulge * .3);
    ctx.quadraticCurveTo(W / 2, topEdge + bulge, 0, topEdge - bulge * .3); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(W, H); ctx.lineTo(W, botEdge + bulge * .3);
    ctx.quadraticCurveTo(W / 2, botEdge - bulge, 0, botEdge + bulge * .3); ctx.closePath(); ctx.fill();
  }
  const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .3, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(10,14,28,0)'); vg.addColorStop(1, `rgba(10,14,28,${.25 + g.d * .35})`);
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  if (g.flash > 0) { ctx.fillStyle = `rgba(255,250,235,${g.flash * .7})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  if (cv.width !== Math.round(stage.clientWidth * DPR)) resize();
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
